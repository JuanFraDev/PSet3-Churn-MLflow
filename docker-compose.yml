services:
  mlflow:
    build:
      context: .
      dockerfile: Dockerfile.mlflow
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow_state/mlflow.db
      - --artifacts-destination
      - /mlflow_state/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - mlflow_state:/mlflow_state
    restart: unless-stopped

  notebook:
    build:
      context: .
      dockerfile: Dockerfile.notebook
    env_file:
      - .env
      - .env.snowflake
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      PYTHONPATH: /workspace
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - ./:/workspace
    working_dir: /workspace
    depends_on:
      - mlflow
    command:
      - sh
      - -c
      - >-
        jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
        --ServerApp.root_dir=/workspace
        --ServerApp.token="$$JUPYTER_TOKEN"
        --ServerApp.allow_remote_access=True --allow-root

volumes:
  mlflow_state:
